<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Window · Brigade</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<!-- The room: a 2.5D floor you can turn (drag) and zoom (wheel). Everything else floats over it. -->
<div id="stage"></div>
<div id="tip" hidden></div>
<div id="pop" hidden></div>

<!-- Top: who this kitchen is · what needs you · the toggles and the frame rate -->
<header id="hud-top">
  <div class="chip ident">
    <span id="conn" class="dot off" title="connection"></span>
    <b id="repo">kitchen</b>
    <span id="mode" class="mono muted"></span>
    <span id="demo" class="badge" hidden>demo</span>
  </div>
  <div id="gate" class="centre"></div>
  <div class="chip toggles">
    <button type="button" data-t="line">Line <kbd>L</kbd></button>
    <button type="button" data-t="heard">Heard <kbd>H</kbd></button>
    <span id="fps" class="mono muted"></span>
  </div>
</header>

<!-- Left: the line, one row per session; a number key selects it -->
<aside id="linepane">
  <div class="h">The line</div>
  <ul id="line"></ul>
</aside>

<!-- Bottom sheet: the rail as a board, or everything heard on the line -->
<section id="sheet" hidden>
  <div class="tabs">
    <button type="button" data-tab="rail">The rail</button>
    <button type="button" data-tab="heard">Heard</button>
    <span class="sp"></span>
    <button type="button" id="filter" class="pill-btn" hidden></button>
    <span id="count" class="mono muted"></span>
    <button type="button" id="sheet-close" class="link">Close</button>
  </div>
  <div id="rail" class="rail" hidden></div>
  <ol id="log" class="log" hidden></ol>
</section>

<!-- Bottom: the rail in numbers · the composer, addressed to the selected session or the sous -->
<footer id="hud-bottom">
  <button type="button" id="railsum" class="chip mono" title="The rail (R)"></button>
  <a id="budgetsum" class="chip mono" href="/ledger" title="The Ledger ($)" hidden></a>
  <form id="chatform">
    <span class="to">to <b id="target">Sous Chef</b></span>
    <input id="chat" type="text" placeholder="Say something to the sous…   ( / )" autocomplete="off" />
    <button type="submit">Send</button>
  </form>
</footer>
<div id="chatnote" class="note float" hidden></div>

<!-- Right: the inspector for the selected figure (I) -->
<aside id="inspector" hidden>
  <section id="d-head"></section>
  <div class="tabs" id="d-tabs"></div>
  <ol id="d-heard" class="heard"></ol>
  <section id="d-controls" hidden></section>
  <section id="d-facts" hidden></section>
</aside>
<script type="module" src="/main.js"></script>
</body>
</html>
