<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Window · Brigade</title>
<link rel="stylesheet" href="/style.css" />
<script type="importmap">{ "imports": { "pixi.js": "/vendor/pixi/pixi.min.mjs" } }</script>
</head>
<body>
<!-- Top bar: who this kitchen is, whether we're connected, the roster as chips, the frame rate. -->
<header id="top">
  <div class="ident">
    <span id="conn" class="dot off" title="connection"></span>
    <span id="title">The Window</span>
    <span class="sep"></span>
    <span id="repo">kitchen</span>
    <span id="mode" class="muted"></span>
    <span id="demo" class="badge" hidden>demo</span>
  </div>
  <ul id="line" title="The line: click one to inspect"></ul>
  <div class="right"><button id="rail-toggle" class="icon" title="Show or hide the rail">▤</button><span id="fps" class="muted"></span></div>
</header>

<div id="body">
  <!-- Left: the rail, read like a board. -->
  <aside id="railpane">
    <h2>The rail</h2>
    <div id="rail" class="rail"></div>
  </aside>

  <!-- Centre: the room, with questions as a banner over it. -->
  <main id="stage">
    <canvas id="kitchen"></canvas>
    <section id="attention" hidden>
      <h2>Needs you</h2>
      <ul id="questions"></ul>
    </section>
  </main>

  <!-- Right: the inspector, only while a figure is selected. -->
  <aside id="inspector" hidden>
    <button id="back" class="icon close" title="Close (Esc)">✕</button>
    <section id="d-head"></section>
    <section id="d-controls"></section>
  </aside>
</div>

<!-- Bottom: the console. Everything heard on the line, filtered to the selected figure, with the prompt at its foot. -->
<section id="console">
  <div id="console-bar">
    <span class="grip" title="Drag to resize"></span>
    <h2>Heard on the line</h2>
    <button id="filter" class="chip" hidden></button>
    <span id="count" class="muted"></span>
    <button id="console-toggle" class="icon" title="Collapse or expand">▾</button>
  </div>
  <ol id="log" class="log"></ol>
  <footer>
    <form id="chatform"><span class="prompt">›</span><input id="chat" type="text" placeholder="Say something to the sous…" autocomplete="off" /><button type="submit">Send</button></form>
    <div id="chatnote" class="note" hidden></div>
  </footer>
</section>
<script type="module" src="/main.js"></script>
</body>
</html>
