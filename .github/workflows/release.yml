# Every merge to main is a release. After check passes on main, tag the commit
# v<version> (plugin.json) and publish a GitHub release whose notes are that
# version's CHANGELOG.md entry. check.sh already refused any PR that didn't bump the
# version or add the entry, so a tag that exists means this commit was released.
# Then the Homebrew tap (mhmzdev/homebrew-brigade) gets Formula/bk.rb with the tarball's
# sha256 filled in, so `brew upgrade bk` picks the release up. That push needs TAP_TOKEN,
# a fine-grained token with contents: write on the tap repo, in this repo's secrets.
name: release

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' plugins/bk/.claude-plugin/plugin.json | head -1)
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists at $(git rev-list -n1 "$tag"); nothing to release"
            exit 0
          fi
          awk -v h="## [$version]" 'index($0, h) == 1 {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "no CHANGELOG.md entry for $version" >&2; exit 1; fi
          gh release create "$tag" --target "$SHA" --title "$tag" --notes-file notes.md

      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "TAP_TOKEN not set: the tap was not updated" >&2; exit 1; fi
          version=$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' plugins/bk/.claude-plugin/plugin.json | head -1)
          url="https://github.com/mhmzdev/claude-code-brigade/archive/refs/tags/v$version.tar.gz"
          for _ in 1 2 3 4 5 6; do curl -fsSL -o release.tar.gz "$url" && break; sleep 10; done
          sha=$(sha256sum release.tar.gz | cut -d' ' -f1)
          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/mhmzdev/homebrew-brigade.git" tap
          mkdir -p tap/Formula
          sed -e "s|sha256 \"[0-9a-f]*\"|sha256 \"$sha\"|" Formula/bk.rb > tap/Formula/bk.rb
          grep -q "$url" tap/Formula/bk.rb || { echo "Formula/bk.rb does not download v$version" >&2; exit 1; }
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/bk.rb
          git diff --cached --quiet && { echo "tap already at $version"; exit 0; }
          git commit -qm "bk $version"
          git push -q origin HEAD
